<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" role="img" aria-label="Annapurna Rebuilt banner">
  <title>Annapurna Rebuilt</title>
  <desc>Cold-Chain Integrity Monitoring and Transactional Cargo Rescue Platform</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="12" fill="url(#bgGrad)"/>
  <rect width="1198" height="238" x="1" y="1" rx="11" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,6">
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
    <line x1="840" y1="0" x2="840" y2="240"/>
    <line x1="960" y1="0" x2="960" y2="240"/>
    <line x1="1080" y1="0" x2="1080" y2="240"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
  </g>

  <!-- Icon Graphic: Cold-Chain Sensor Node & Shield -->
  <g transform="translate(68, 60)">
    <!-- Hexagon node background -->
    <polygon points="60,10 105,35 105,85 60,110 15,85 15,35" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <!-- Snowflake / thermal node motif -->
    <circle cx="60" cy="60" r="14" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="36" x2="60" y2="84" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="39" y1="48" x2="81" y2="72" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="39" y1="72" x2="81" y2="48" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="4" fill="#38bdf8"/>
    <!-- Connected orbital nodes -->
    <line x1="105" y1="60" x2="135" y2="60" stroke="#10b981" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="138" cy="60" r="4" fill="#10b981"/>
    <line x1="60" y1="110" x2="60" y2="130" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="60" cy="133" r="4" fill="#3b82f6"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(240, 78)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#10b981"/>
    <text x="24" y="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="0.08em">COLD-CHAIN RESILIENCE</text>

    <!-- Main Title -->
    <text x="0" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      ANNAPURNA <tspan fill="url(#emeraldGrad)">REBUILT</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.01em">
      From in-transit thermal signals to atomic, coordinated cargo rescue.
    </text>

    <!-- Architecture summary chips -->
    <g transform="translate(0, 116)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="14" fill="#94a3b8">Next.js 16</text>

      <rect x="84" y="0" width="102" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="94" y="14" fill="#94a3b8">PostgreSQL ACID</text>

      <rect x="194" y="0" width="78" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="204" y="14" fill="#94a3b8">Prisma ORM</text>

      <rect x="280" y="0" width="124" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="290" y="14" fill="#94a3b8">Row-Locked Auctions</text>
    </g>
  </g>
</svg>
